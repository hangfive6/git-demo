[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mini-agent-lab"
version = "0.1.0"
description = "A small, testable tool-calling agent built on the OpenAI Responses API"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "openai>=2.0.0",
  "python-dotenv>=1.0.1",
  "tzdata>=2025.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.scripts]
mini-agent = "agent_starter.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_starter"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

